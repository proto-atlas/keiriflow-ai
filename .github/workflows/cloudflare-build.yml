name: Cloudflare Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloudflare-build:
    name: Cloudflare build on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for Cloudflare Workers
        run: pnpm cf:build

      - name: Package Cloudflare build output
        run: |
          tar --dereference -czf open-next-cloudflare.tar.gz .open-next
          test -s open-next-cloudflare.tar.gz
          tar -tzf open-next-cloudflare.tar.gz > /dev/null

      - name: Upload Cloudflare build output
        uses: actions/upload-artifact@v7
        with:
          name: open-next-cloudflare
          path: open-next-cloudflare.tar.gz
