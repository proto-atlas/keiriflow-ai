name: Cloudflare Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloudflare-deploy:
    name: Cloudflare deploy on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for Cloudflare Workers
        run: pnpm cf:build

      - name: Package Cloudflare build output
        run: |
          tar --dereference -czf open-next-cloudflare.tar.gz .open-next
          test -s open-next-cloudflare.tar.gz
          tar -tzf open-next-cloudflare.tar.gz > /dev/null

      - name: Upload Cloudflare build output
        uses: actions/upload-artifact@v7
        with:
          name: open-next-cloudflare
          path: open-next-cloudflare.tar.gz

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec opennextjs-cloudflare deploy

      - name: Verify production routes
        run: |
          for path in /dashboard /invoices /invoices/doc-001; do
            response_file=$(mktemp)
            status=$(curl --silent --show-error --retry 3 --retry-delay 2 \
              --output "$response_file" --write-out "%{http_code}" \
              "https://keiriflow-ai.atlas-lab.workers.dev${path}")
            test "$status" = "200"
            test -s "$response_file"
          done
